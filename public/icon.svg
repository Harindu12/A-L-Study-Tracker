<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="#F6F2E7" rx="112" />
  <!-- A simple notebook-style graphic -->
  <rect x="120" y="80" width="272" height="352" fill="#ffffff" rx="16" stroke="#8B6F9E" stroke-width="16" />
  <line x1="160" y1="160" x2="352" y2="160" stroke="#b8a4c9" stroke-width="12" stroke-linecap="round" />
  <line x1="160" y1="220" x2="352" y2="220" stroke="#b8a4c9" stroke-width="12" stroke-linecap="round" />
  <line x1="160" y1="280" x2="352" y2="280" stroke="#b8a4c9" stroke-width="12" stroke-linecap="round" />
  <!-- Checkmark -->
  <path d="M 180 360 L 220 400 L 320 300" fill="none" stroke="#4f7a5c" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Spiral binding holes -->
  <circle cx="100" cy="120" r="16" fill="#2E2A24" />
  <circle cx="100" cy="180" r="16" fill="#2E2A24" />
  <circle cx="100" cy="240" r="16" fill="#2E2A24" />
  <circle cx="100" cy="300" r="16" fill="#2E2A24" />
  <circle cx="100" cy="360" r="16" fill="#2E2A24" />
</svg>
